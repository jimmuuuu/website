<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Basketball court in receding perspective with a corner-mounted security camera">
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0ef"/><stop offset="1" stop-color="#e3f1fb"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bsky)"/>
  <circle cx="120" cy="60" r="30" fill="#f7d154"/>
  <ellipse cx="470" cy="70" rx="60" ry="19" fill="#fff" opacity="0.9"/>
  <rect y="120" width="640" height="60" fill="#2e7d32"/>
  <!-- one-point perspective court receding to upper-right vanishing point -->
  <polygon points="0,400 250,180 640,210 640,400" fill="#c75b39"/>
  <polygon points="0,400 250,180 640,210 640,400" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- perspective lane lines -->
  <line x1="120" y1="400" x2="320" y2="195" stroke="#fff" stroke-width="3" opacity="0.8"/>
  <line x1="360" y1="400" x2="430" y2="200" stroke="#fff" stroke-width="3" opacity="0.8"/>
  <ellipse cx="300" cy="300" rx="120" ry="42" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- hoop at far end -->
  <rect x="430" y="150" width="7" height="60" fill="#444"/>
  <rect x="412" y="138" width="40" height="26" rx="3" fill="#fff" stroke="#444" stroke-width="2"/>
  <ellipse cx="432" cy="166" rx="11" ry="4" fill="none" stroke="#e35d5d" stroke-width="3"/>
  <!-- big camera mounted top-left corner, angled down across court -->
  <g transform="translate(70 60)">
    <rect x="-6" y="-60" width="12" height="70" rx="4" fill="#3a424d"/>
    <rect x="0" y="-4" width="46" height="11" rx="5" fill="#48515d"/>
    <g transform="translate(40 -16) rotate(18)">
      <rect x="-8" y="0" width="74" height="40" rx="12" fill="#2c343e" stroke="#161b21" stroke-width="3"/>
      <rect x="-8" y="0" width="74" height="15" rx="12" fill="#3a434f"/>
      <rect x="-15" y="-5" width="52" height="10" rx="5" fill="#404b57"/>
      <circle cx="60" cy="20" r="18" fill="#0d1218"/>
      <circle cx="60" cy="20" r="11" fill="#1d2733"/>
      <circle cx="64" cy="16" r="4.5" fill="#9fd8ff"/>
      <circle cx="-1" cy="10" r="3.2" fill="#ff4d4d"/>
      <path d="M78 20 L260 150 L210 235 Z" fill="#9fd8ff" opacity="0.12"/>
    </g>
  </g>
  <circle cx="250" cy="330" r="20" fill="#e07b39"/>
  <path d="M230 330 H270 M250 310 V350" stroke="#7a3e16" stroke-width="2" fill="none"/>
</svg>
