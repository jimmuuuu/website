<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Elevated aerial view of a baseball diamond watched by a security camera">
  <defs>
    <radialGradient id="bfg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#5fb35f"/><stop offset="1" stop-color="#3f8e41"/>
    </radialGradient>
  </defs>
  <!-- elevated/aerial view: mostly field, looking down -->
  <rect width="640" height="400" fill="url(#bfg)"/>
  <!-- outfield arc -->
  <path d="M120 400 A 260 260 0 0 1 520 400 Z" fill="#4ca150"/>
  <!-- infield diamond seen from above, tilted -->
  <polygon points="320,120 470,250 320,360 170,250" fill="#d9a566"/>
  <polygon points="320,165 415,250 320,330 225,250" fill="#5fae5f"/>
  <!-- bases -->
  <rect x="313" y="113" width="14" height="14" transform="rotate(45 320 120)" fill="#fff"/>
  <rect x="463" y="243" width="14" height="14" transform="rotate(45 470 250)" fill="#fff"/>
  <rect x="163" y="243" width="14" height="14" transform="rotate(45 170 250)" fill="#fff"/>
  <polygon points="312,352 328,352 328,362 320,370 312,362" fill="#fff"/>
  <ellipse cx="320" cy="250" rx="22" ry="12" fill="#d9a566"/>
  <!-- mowing rings to sell the aerial look -->
  <path d="M120 400 A 200 200 0 0 1 520 400" fill="none" stroke="#57a957" stroke-width="10" opacity="0.5"/>
  <path d="M160 400 A 150 150 0 0 1 480 400" fill="none" stroke="#57a957" stroke-width="10" opacity="0.5"/>
  <!-- camera high in upper-left, looking down across the diamond -->
  <g transform="translate(70 70)">
    <rect x="-5" y="-50" width="10" height="60" rx="4" fill="#3a424d"/>
    <rect x="0" y="-2" width="40" height="10" rx="5" fill="#48515d"/>
    <g transform="translate(34 -12) rotate(28)">
      <rect x="-7" y="0" width="66" height="36" rx="11" fill="#2c343e" stroke="#161b21" stroke-width="3"/>
      <rect x="-7" y="0" width="66" height="14" rx="11" fill="#3a434f"/>
      <rect x="-13" y="-5" width="46" height="9" rx="4" fill="#404b57"/>
      <circle cx="53" cy="18" r="16" fill="#0d1218"/>
      <circle cx="53" cy="18" r="10" fill="#1d2733"/>
      <circle cx="57" cy="14" r="4" fill="#9fd8ff"/>
      <circle cx="-1" cy="9" r="3" fill="#ff4d4d"/>
      <path d="M69 18 L300 170 L250 250 Z" fill="#9fd8ff" opacity="0.1"/>
    </g>
  </g>
  <circle cx="320" cy="250" r="7" fill="#e35d5d"/>
</svg>
