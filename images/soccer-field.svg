<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Close-up of a security camera with a soccer field below at an angle">
  <defs>
    <linearGradient id="ssky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec9f0"/><stop offset="1" stop-color="#e8f4fc"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#ssky)"/>
  <circle cx="560" cy="60" r="32" fill="#f7d154"/>
  <ellipse cx="200" cy="70" rx="55" ry="18" fill="#fff" opacity="0.9"/>
  <!-- low horizon: lots of sky, field as an angled band in lower third -->
  <polygon points="0,250 640,210 640,400 0,400" fill="#4ca150"/>
  <polygon points="0,250 640,210 640,260 0,300" fill="#57a957" opacity="0.6"/>
  <!-- angled field lines (perspective) -->
  <line x1="60" y1="300" x2="600" y2="250" stroke="#fff" stroke-width="3" opacity="0.8"/>
  <ellipse cx="360" cy="320" rx="80" ry="22" fill="none" stroke="#fff" stroke-width="3" opacity="0.8"/>
  <!-- far goal -->
  <rect x="500" y="222" width="60" height="34" fill="none" stroke="#fff" stroke-width="3" opacity="0.85"/>
  <!-- giant close-up camera dominating upper-left foreground -->
  <g transform="translate(80 30)">
    <rect x="-8" y="120" width="16" height="200" rx="6" fill="#3a424d"/>
    <rect x="-52" y="108" width="70" height="15" rx="6" fill="#48515d"/>
    <g transform="translate(-58 40) rotate(-8)">
      <rect x="-12" y="0" width="118" height="64" rx="18" fill="#2c343e" stroke="#13181e" stroke-width="4"/>
      <rect x="-12" y="0" width="118" height="24" rx="18" fill="#3a434f"/>
      <rect x="-22" y="-9" width="84" height="15" rx="7" fill="#404b57"/>
      <circle cx="96" cy="32" r="29" fill="#0d1218"/>
      <circle cx="96" cy="32" r="18" fill="#1d2733"/>
      <circle cx="103" cy="24" r="7" fill="#9fd8ff"/>
      <circle cx="104" cy="25" r="2.5" fill="#fff"/>
      <circle cx="-2" cy="16" r="5" fill="#ff4d4d"/>
      <path d="M124 32 L320 120 L300 220 Z" fill="#9fd8ff" opacity="0.13"/>
    </g>
  </g>
  <circle cx="430" cy="300" r="13" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M430 292 l6 5 -2 7 h-8 l-2 -7 Z" fill="#333"/>
</svg>
